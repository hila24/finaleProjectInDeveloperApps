<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SnapVote — העלו · דרגו · היעלמו</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f6f4ff; color: #1b1630; padding: 24px;
    }
    .card {
      max-width: 420px; width: 100%; background: #fff; border: 1px solid #e1dcf2;
      border-radius: 28px; padding: 32px 24px; text-align: center;
    }
    .logo {
      width: 68px; height: 68px; margin: 0 auto 18px;
      border-radius: 22px; background: linear-gradient(135deg, #6c4df6, #ff5ca8);
    }
    h1 { margin: 0 0 4px; font-size: 27px; }
    .tag { margin: 0 0 22px; color: #6b6786; font-size: 15px; }
    p { color: #6b6786; line-height: 1.65; margin: 0 0 22px; font-size: 15px; }
    .btn {
      display: block; padding: 15px 20px; border-radius: 16px; text-decoration: none;
      font-weight: 700; font-size: 16px; background: #6c4df6; color: #fff;
    }
    .hint { margin: 18px 0 0; font-size: 13px; color: #8b87a3; }
    code { background: #eae4ff; padding: 2px 8px; border-radius: 6px; font-size: 13px; }
    @media (prefers-color-scheme: dark) {
      body { background: #100d1b; color: #f2efff; }
      .card { background: #191527; border-color: #332c4d; }
      .tag, p { color: #a8a2c4; }
      code { background: #332c4d; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo"></div>
    <h1>SnapVote</h1>
    <p class="tag">העלו · דרגו · היעלמו</p>
    <p id="message">הוזמנת להצביע בסקר תמונות. פתחי את הקישור מהטלפון שבו מותקנת האפליקציה.</p>
    <a class="btn" id="open" href="#">פתיחה באפליקציה</a>
    <p class="hint">אם האפליקציה לא מותקנת, בקשי מהחברה שיצרה את הסקר לשלוח לך את קובץ ההתקנה.</p>
  </div>

  <script>
    // /poll/<id> – hand the id over to the app through its custom scheme.
    var match = location.pathname.match(/\/poll\/([^\/?#]+)/);
    var open = document.getElementById('open');
    if (match) {
      open.href = 'snapvote://poll/' + match[1];
      document.getElementById('message').textContent =
        'הוזמנת להצביע בסקר. אם האפליקציה מותקנת, הקישור ייפתח בה אוטומטית.';
    } else {
      open.href = 'snapvote://feed';
    }
  </script>
</body>
</html>
